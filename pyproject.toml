[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drove"
version = "0.1.0"
description = "Local autonomous engineering pipeline — plan, execute, cross-model review and verify, driving the coding CLIs you already have"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    # The in-app terminal is a WebSocket; uvicorn speaks one only when this is installed.
    "websockets>=12.0",
]

[project.optional-dependencies]
# Browser checks are opt-in: most projects have no web UI to open.
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27", "playwright>=1.44"]
# Used only on the release machine to bundle the local daemon into Drove.app.
desktop = ["pyinstaller>=6.10"]

[project.scripts]
drove = "drove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["drove"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits a real harness CLI and spends tokens (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call-expressions in defaults; that is the framework idiom.
"drove/cli.py" = ["B008"]
