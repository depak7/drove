# drove project config

base_branch = "main"

[verify]
# Run in the feature's worktree after review passes.
test = "uv run --extra dev pytest -q"
lint = "uv run --extra dev ruff check ."

[harness]
# Cross-harness by stage: whoever writes the code must not be the one who reviews it.
plan = "claude"
execute = "claude"
review = "codex"
arbiter = "opencode"
